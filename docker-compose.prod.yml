services:
  api: &api
    build:
      context: ./SuppHubBackend/supphub
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - database
      - cache
    volumes:
      - django_static_data:/app/staticfiles
      - ./SuppHubBackend/supphub/media:/app/media
    restart: always
  database:
    image: postgres:17.5
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
  cache:
    image: redis:7
    ports:
      - "6379:6379"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - api
    restart: always
  nginx:
    image: nginx:1.27-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/public:/usr/share/nginx/html/public
      - ./SuppHubBackend/supphub/media:/usr/share/nginx/html/media:ro
      - django_static_data:/usr/share/nginx/html/static:ro
    depends_on:
      - api
      - frontend
    restart: always

volumes:
  pgdata:
  django_static_data:
