services:
  api: &api
    build:
      context: ./SuppHubBackend/supphub
      dockerfile: Dockerfile
      target: dev
    ports:
      - 8000:8000
    env_file:
      - .env
    depends_on:
      - cache
      - database
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - django_static_data:/app/staticfiles
      - ./SuppHubBackend/supphub:/app
    restart: always
  database:
    image: postgres:17.5
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
  cache:
    image: redis:7
    ports:
      - 6379:6379
  frontend:
    build:
      context: ./frontend
      target: builder
      args:
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
        API_NOVA_POST: ${API_NOVA_POST}
    ports:
      - 3000:3000
    env_file:
      - .env
    command: npm run dev
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: always

volumes:
  pgdata:
  django_static_data:
