services:
  api: &api
    build:
      context: ./SuppHubBackend/supphub
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - ./SuppHubBackend/supphub/.env
    depends_on:
      - database
    volumes:
      - ./SuppHubBackend/supphub:/app
  database:
    image: postgres:17.5
    env_file: ./SuppHubBackend/supphub/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

volumes:
  pgdata:
